# Blueprint de Render (plan 10.1): el servicio web y la base del sitio, en la misma región. Campos verificados en
# https://render.com/docs/blueprint-spec el 26/10/2026. Lo que cambia por cuenta (la casilla, la clave, el corte) va con
# sync: false: Render lo pide al crear el Blueprint y después no lo pisa. En el dashboard, Blueprint → Settings →
# Auto Sync: No (se sincroniza a mano). Edge Caching del servicio web: "Common static files".
services:
  - type: web
    name: mupa-web
    runtime: node                       # la versión sale de .node-version (24)
    region: virginia                    # no se puede cambiar después
    plan: 0.5c-512mb                    # 0,5 CPU y 512 MB, USD 7 por mes
    branch: master
    autoDeployTrigger: off              # se despliega a mano (Manual Deploy)
    buildCommand: npm ci --include=dev && npm run build   # con NODE_ENV=production, npm ci saltearía Vite
    preDeployCommand: npm run migrar    # si una migración falla, el deploy no sigue
    startCommand: npm start
    healthCheckPath: /salud
    maxShutdownDelaySeconds: 30
    # Sin disco: las fotos van en la base (plan 16.1).
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: mupa-db, property: connectionString } }   # red interna, sin TLS
      - { key: URL_PUBLICA, value: "https://mupa.ar/" }   # canonical y redes; el host de Render sale con noindex
      - { key: ESPACIO_BASE_MB, value: "1024" }           # = diskSizeGB de la base × 1024: cambiarlos juntos
      - { key: CORREO_MODO, value: smtp }
      - { key: SMTP_HOST, value: smtp.hostinger.com }
      - { key: SMTP_PUERTO, sync: false }                 # 465; 587 si 465 no conecta
      - { key: SMTP_USUARIO, sync: false }                # web@mupa.ar; vacía: el formulario queda apagado
      - { key: SMTP_CLAVE, sync: false }
      - { key: CANONICO, sync: false }                    # 0 hasta el corte del dominio
      - { key: TRUST_PROXY, sync: false }                 # se ajusta con DEPURAR_IP=1 y /salud/ip (plan 10.1, paso 4)
      - { key: USERWAY_ID, sync: false }                  # vacía: UserWay apagado
      - { key: INDEXNOW_CLAVE, sync: false }              # opcional; vacía: IndexNow apagado
databases:
  - name: mupa-db
    region: virginia                    # la misma que el servicio web
    plan: 0.1c-256mb                    # Basic 256 MB, USD 6 por mes
    postgresMajorVersion: "17"          # la misma que en desarrollo; no se puede cambiar después
    diskSizeGB: 1                       # 1 o múltiplos de 5; si se omite, Basic arranca en 15 GB
    ipAllowList: []                     # sin conexiones desde afuera de Render
